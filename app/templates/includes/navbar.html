<header class="topbar d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center gap-3">
        <button id="sidebarToggle" class="icon-btn d-lg-none" type="button" aria-label="Toggle sidebar">
            <i class="bi bi-list"></i>
        </button>
        <div class="topbar-title">
            <span class="eyebrow">Overview</span>
            <h1 id="pageTitle">{{ page_title|default('Dashboard') }}</h1>
        </div>
    </div>

    <div class="d-flex align-items-center gap-3">
        <a class="icon-btn position-relative" href="/notifications" aria-label="Notifications">
            <i class="bi bi-bell"></i>
            <span class="notif-dot d-none" id="navNotifDot"></span>
        </a>

        <div class="dropdown">
            <button class="user-chip dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <span class="avatar" id="navAvatarInitial">U</span>
                <span class="user-chip-text d-none d-sm-flex flex-column">
                    <strong id="navUserName">User</strong>
                    <small id="navUserRole" class="text-uppercase">role</small>
                </span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>My Profile</a></li>
                <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Settings</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
            </ul>
        </div>
    </div>
</header>
